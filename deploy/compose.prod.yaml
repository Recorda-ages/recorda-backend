# Produção na AWS: API (imagem do ghcr.io) + Caddy (HTTPS). O banco fica no RDS.
# Uso na EC2, a partir da raiz do repositório:
#   sudo docker compose -f deploy/compose.prod.yaml pull
#   sudo docker compose -f deploy/compose.prod.yaml up -d
services:
  api:
    image: ghcr.io/recorda-ages/recorda-backend:latest
    restart: always
    env_file: .env.prod
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: always
    env_file: .env.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
