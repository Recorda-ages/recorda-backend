[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recorda-backend"
version = "0.1.0"
description = "Backend FastAPI do projeto Recorda (API em camadas Route -> Service -> Repository -> DB)."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "psycopg[binary]>=3.3.4",
]
