name: Docker image

# Gera a imagem arm64 (para a EC2 t4g) e publica no GitHub Container Registry.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build arm64 e push para ghcr.io
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/recorda-ages/recorda-backend:latest
            ghcr.io/recorda-ages/recorda-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
