name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Validate PR
        uses: ./.github/actions/validate-pr
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
  lint:
    name: Lint / Format (Ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test-unit:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run unit tests with coverage
        run: |
          if [ ! -d tests ]; then
            echo "Nenhum diretório de testes encontrado."
            exit 0
          fi
          pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage-unit.xml --cov-fail-under=80 tests/

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage-unit.xml
          if-no-files-found: ignore

  gitlab-sync:
    name: GitLab Sync
    needs: [lint, test-unit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/gitlab-sync.yml
    with:
      gitlab_repo_name: backend
    secrets:
      gitlab_token: ${{ secrets.gitlab_token }}
